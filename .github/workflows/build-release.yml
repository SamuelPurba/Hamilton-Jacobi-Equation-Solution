name: Build & Publish Release Executable (Scopus Q1 Standards)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib PyQt6 scipy pyqtgraph pyinstaller

    - name: Build Executable via PyInstaller
      run: |
        python build_exe.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Hamilton_Jacobi_Solver_Windows_Executable
        path: dist/Hamilton_Jacobi_Solver/
