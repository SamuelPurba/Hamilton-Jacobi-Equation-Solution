name: Daily Routine Automated Health Check (Scopus Q1 Standards)

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  daily-health-check:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib PyQt6 scipy pyqtgraph

    - name: Execute Daily Routine Health Suite
      run: |
        python daily_routine.py
